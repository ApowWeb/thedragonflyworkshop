<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE DRAGONFLY WORKSHOP</title>

    <style>

        /* =================================
           RESET
           ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =================================
           PAGE
           ================================= */

        .home {
            --purple: #2b22d6;
            --dark-purple: #2118a8;

            position: relative;
            min-height: 100vh;
            overflow: hidden;

            padding: 76px 30px 80px;

            background: white;
            color: var(--purple);
        }


        /* =================================
           GRILLE 3D
           ================================= */

        .grid {
            position: absolute;

            left: -30%;
            right: -30%;
            bottom: -180px;

            height: 520px;

            opacity: 0.07;

            background:
                linear-gradient(
                    rgba(43, 34, 214, 0.35) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(43, 34, 214, 0.35) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            transform:
                perspective(500px)
                rotateX(60deg);

            transform-origin: center bottom;

            mask-image:
                linear-gradient(
                    to top,
                    black,
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =================================
           PETITE PLANÈTE / ORBITE
           ================================= */

        .orb {
            position: absolute;

            width: 170px;
            height: 170px;

            right: 12%;
            top: 12%;

            z-index: 3;

            pointer-events: none;

            animation:
                orbFloat 5.5s ease-in-out infinite;
        }


        /* =================================
           HALO
           ================================= */

        .orb-glow {
            position: absolute;

            width: 125px;
            height: 125px;

            left: 22px;
            top: 22px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(43, 34, 214, 0.20) 0%,
                    rgba(120, 70, 220, 0.13) 38%,
                    rgba(43, 34, 214, 0.04) 58%,
                    transparent 72%
                );

            filter: blur(10px);

            animation:
                orbPulse 4s ease-in-out infinite;
        }


        /* =================================
           ANNEAUX
           ================================= */

        .orb-ring {
            position: absolute;

            border-radius: 50%;

            border: 1px solid;

            transform-style: preserve-3d;
        }


        .orb-ring-1 {
            width: 128px;
            height: 48px;

            left: 21px;
            top: 61px;

            border-color:
                rgba(43, 34, 214, 0.70);

            box-shadow:
                0 0 8px rgba(43, 34, 214, 0.15);

            transform:
                rotate(-18deg)
                rotateX(62deg);

            animation:
                ringRotate 7s linear infinite;
        }


        .orb-ring-2 {
            width: 105px;
            height: 55px;

            left: 33px;
            top: 57px;

            border-color:
                rgba(120, 65, 220, 0.65);

            box-shadow:
                0 0 7px rgba(120, 65, 220, 0.12);

            transform:
                rotate(32deg)
                rotateX(62deg);

            animation:
                ringRotateReverse 9s linear infinite;
        }


        /* =================================
           NOYAU DE LA PLANÈTE
           ================================= */

        .orb-core {
            position: absolute;

            width: 58px;
            height: 58px;

            left: 56px;
            top: 56px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #bba8ff 0%,
                    #7658e0 22%,
                    #4034c7 52%,
                    #2b22d6 78%,
                    #1d178b 100%
                );

            box-shadow:
                0 8px 18px rgba(43, 34, 214, 0.25),
                0 0 18px rgba(43, 34, 214, 0.18);

            animation:
                corePulse 3.5s ease-in-out infinite;
        }


        /* Lumière interne */

        .orb-core-inner {
            position: absolute;

            width: 22px;
            height: 22px;

            left: 18px;
            top: 17px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.95),
                    rgba(180, 170, 255, 0.6) 35%,
                    rgba(43, 34, 214, 0) 75%
                );

            filter: blur(1px);
        }


        /* Reflet */

        .orb-shine {
            position: absolute;

            width: 10px;
            height: 18px;

            left: 14px;
            top: 9px;

            border-radius: 50%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.9),
                    rgba(255, 255, 255, 0)
                );

            transform: rotate(25deg);

            opacity: 0.8;

            filter: blur(0.5px);
        }


        /* =================================
           PARTICULES
           ================================= */

        .orb-particle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: var(--purple);

            box-shadow:
                0 0 7px rgba(43, 34, 214, 0.70);
        }


        .orb-particle-1 {
            left: 25px;
            top: 40px;

            animation:
                particleFloat1 4s ease-in-out infinite;
        }


        .orb-particle-2 {
            right: 20px;
            top: 95px;

            width: 3px;
            height: 3px;

            background: #7658e0;

            box-shadow:
                0 0 7px rgba(118, 88, 224, 0.8);

            animation:
                particleFloat2 5s ease-in-out infinite;
        }


        .orb-particle-3 {
            left: 42px;
            bottom: 28px;

            width: 3px;
            height: 3px;

            background: #a58cff;

            box-shadow:
                0 0 7px rgba(165, 140, 255, 0.7);

            animation:
                particleFloat3 4.5s ease-in-out infinite;
        }


        /* =================================
           ANIMATIONS
           ================================= */

        @keyframes orbFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(2deg);
            }
        }


        @keyframes orbPulse {

            0%,
            100% {
                opacity: 0.75;
                transform: scale(0.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }


        @keyframes corePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }


        @keyframes ringRotate {

            from {
                transform:
                    rotate(-18deg)
                    rotateX(62deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    rotate(-18deg)
                    rotateX(62deg)
                    rotateZ(360deg);
            }
        }


        @keyframes ringRotateReverse {

            from {
                transform:
                    rotate(32deg)
                    rotateX(62deg)
                    rotateZ(360deg);
            }

            to {
                transform:
                    rotate(32deg)
                    rotateX(62deg)
                    rotateZ(0deg);
            }
        }


        @keyframes particleFloat1 {

            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.45;
            }

            50% {
                transform: translate(-5px, -9px);
                opacity: 1;
            }
        }


        @keyframes particleFloat2 {

            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.4;
            }

            50% {
                transform: translate(6px, -7px);
                opacity: 1;
            }
        }


        @keyframes particleFloat3 {

            0%,
            100% {
                transform: translate(0, 0);
                opacity: 0.35;
            }

            50% {
                transform: translate(-5px, 6px);
                opacity: 0.9;
            }
        }


        /* =================================
           PETIT CERCLE
           ================================= */

        .cross {
            position: absolute;

            width: 9px;
            height: 9px;

            right: 8%;
            top: 13%;

            border:
                1px solid var(--purple);

            border-radius: 50%;

            pointer-events: none;
        }


        /* =================================
           CONTENU
           ================================= */

        .content {
            position: relative;

            z-index: 5;

            width: 100%;
            max-width: 620px;

            margin: 0 auto;
        }


        /* =================================
           TITRE
           ================================= */

        h1 {
            margin: 0;

            text-align: center;

            font-family: Georgia, serif;

            font-size: 50px;

            font-weight: 400;

            line-height: 1.1;

            letter-spacing: -1px;
        }


        /* =================================
           LIGNE SOUS LE TITRE
           ================================= */

        .line {
            width: 400px;
            max-width: 70%;

            height: 2px;

            margin: 17px auto 0;

            background:
                var(--purple);
        }


        /* =================================
           SIGNATURE
           ================================= */

        .signature {
            margin-top: 15px;

            text-align: center;

            color: #aaa;

            font-style: italic;

            font-size: 15px;
        }


        /* =================================
           NAVIGATION
           ================================= */

        nav {
            width: 400px;
            max-width: 100%;

            margin: 45px auto 0;
        }


        nav a {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 6px 0;

            color:
                var(--purple);

            text-decoration: none;

            font-size: 28px;

            line-height: 1.35;

            border-bottom:
                1px solid
                rgba(43, 34, 214, 0.16);

            transition:
                color 0.2s ease,
                padding-left 0.25s ease,
                border-color 0.2s ease;
        }


        nav a:hover {
            color:
                var(--dark-purple);

            padding-left: 10px;

            border-color:
                rgba(43, 34, 214, 0.5);
        }


        /* =================================
           MOBILE
           ================================= */

        @media (max-width: 600px) {

            .home {
                padding:
                    55px 24px 70px;
            }


            h1 {
                font-size: 38px;
            }


            .line {
                width: 280px;
            }


            .orb {
                right: -28px;
                top: 10%;

                transform: scale(0.75);
            }


            nav {
                margin-top: 45px;
            }


            nav a {
                font-size: 25px;
            }


            .signature {
                font-size: 14px;
            }
        }


        /* =================================
           MOINS D'ANIMATION
           ================================= */

        @media (prefers-reduced-motion: reduce) {

            .orb,
            .orb-glow,
            .orb-core,
            .orb-ring,
            .orb-particle-1,
            .orb-particle-2,
            .orb-particle-3 {
                animation: none;
            }
        }

    </style>
</head>


<body>

    <div class="home">

        <!-- DÉCOR -->
        <div class="grid"></div>


        <!-- PETITE PLANÈTE -->
        <div class="orb" aria-hidden="true">

            <div class="orb-glow"></div>

            <div class="orb-ring orb-ring-1"></div>
            <div class="orb-ring orb-ring-2"></div>

            <div class="orb-core">
                <div class="orb-core-inner"></div>
                <div class="orb-shine"></div>
            </div>

            <div class="orb-particle orb-particle-1"></div>
            <div class="orb-particle orb-particle-2"></div>
            <div class="orb-particle orb-particle-3"></div>

        </div>


        <!-- PETIT CERCLE DÉCORATIF -->
        <div class="cross"></div>


        <!-- CONTENU PRINCIPAL -->
        <div class="content">

            <h1>THE DRAGONFLY WORKSHOP</h1>

            <div class="line"></div>

            <div class="signature">
                by Apolline Blondet
            </div>


            <!-- NAVIGATION -->
            <nav>

                <a
                    href="https://apollineblondet.wixsite.com/arts"
                    target="_blank"
                    rel="noopener"
                >
                    <span>→ Portfolio 2D</span>
                </a>


                <a
                    href="https://apollineblondet.wixsite.com/apollineblondet"
                    target="_blank"
                    rel="noopener"
                >
                    <span>→ Portfolio 3D</span>
                </a>


                <a
                    href="https://dragonfly.myspreadshop.fr/"
                    target="_blank"
                    rel="noopener"
                >
                    <span>→ Boutique</span>
                </a>


                <a
                    href="https://apollineblondet.wixsite.com/arts/book"
                    target="_blank"
                    rel="noopener"
                >
                    <span>→ Livre</span>
                </a>

            </nav>

        </div>

    </div>

</body>
</html>
